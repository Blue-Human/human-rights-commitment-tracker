name: HRCT monitoring manual fallback
on:
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [discover, process, watch]
        default: discover
permissions:
  contents: read
concurrency:
  group: hrct-manual-monitoring
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invoke authenticated monitoring job
        env:
          HRCT_MONITORING_URL: https://gostbdmrzchccnydftgd.supabase.co/functions/v1/live-tracker
          HRCT_MONITORING_SECRET: ${{ secrets.HRCT_MONITORING_SECRET }}
          HRCT_JOB: ${{ inputs.job }}
        run: node scripts/run-monitoring.mjs
