name: HRCT Live Tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run HRCT live tracker
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 10 \
            -X POST \
            https://gostbdmrzchccnydftgd.supabase.co/functions/v1/live-tracker
